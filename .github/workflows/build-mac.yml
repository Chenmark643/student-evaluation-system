name: Build macOS app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则使用 config.py）"
        required: false
        default: "14.0.3"
  push:
    branches: [main, master, "macos-*"]
    tags: ["v*"]

jobs:
  build-mac:
    name: macOS arm64
    runs-on: macos-15
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt Pillow

      - name: 验证当前架构与核心模块
        run: |
          python - <<'PY'
          import platform
          from backend.moral_vnext import build_moral_preview
          from backend.api import DesktopApi
          print("machine:", platform.machine())
          print("DesktopApi:", DesktopApi.__name__)
          print("moral engine:", build_moral_preview.__name__)
          PY
          test "$(uname -m)" = "arm64"

      - name: 下载并校验金山文档 CLI
        env:
          KDOCS_CLI_VERSION: "2.5.14"
          KDOCS_CLI_SHA256: "eff9ac66c208dbed3c5e06ea1aa49fa61c5d98b77f8349519af9b8637806b7a0"
        run: |
          mkdir -p vendor .kdocs-download
          ARCHIVE="kdocs-cli-${KDOCS_CLI_VERSION}-darwin-arm64.tar.gz"
          URL="https://wpsai.wpscdn.cn/skillhub/pro/v${KDOCS_CLI_VERSION}/releases/${ARCHIVE}"
          curl --fail --location --retry 3 --output ".kdocs-download/${ARCHIVE}" "$URL"
          echo "${KDOCS_CLI_SHA256}  .kdocs-download/${ARCHIVE}" | shasum -a 256 -c -
          tar -xzf ".kdocs-download/${ARCHIVE}" -C .kdocs-download
          CLI_PATH="$(find .kdocs-download -type f -name kdocs-cli -print -quit)"
          test -n "$CLI_PATH"
          install -m 755 "$CLI_PATH" vendor/kdocs-cli
          test "$(vendor/kdocs-cli version | head -n 1 | tr -d '\r')" != ""

      - name: 生成 macOS 图标
        run: |
          mkdir -p logo.iconset
          sips -z 16 16 logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32 logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32 logo.png --out logo.iconset/icon_32x32.png
          sips -z 64 64 logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128 logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256 logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256 logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512 logo.png --out logo.iconset/icon_256x256@2x.png
          sips -z 512 512 logo.png --out logo.iconset/icon_512x512.png
          sips -z 1024 1024 logo.png --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset
          rm -rf logo.iconset

      - name: 构建 .app
        run: |
          python -m PyInstaller --clean --noconfirm build_mac.spec
          test -d "dist/顿河学院学生测评管理软件.app"
          test -x "dist/顿河学院学生测评管理软件.app/Contents/MacOS/顿河学院学生测评管理软件"
          python - <<'PY'
          from pathlib import Path
          toc_files = list(Path("build").rglob("Analysis-00.toc"))
          assert toc_files, "PyInstaller analysis manifest not found"
          assert any("kdocs-cli" in path.read_text(encoding="utf-8", errors="ignore") for path in toc_files)
          print("bundled kdocs-cli: verified")
          PY

      - name: 临时签名并验证应用
        run: |
          codesign --force --deep --sign - "dist/顿河学院学生测评管理软件.app"
          codesign --verify --deep --strict --verbose=2 "dist/顿河学院学生测评管理软件.app"
          plutil -p "dist/顿河学院学生测评管理软件.app/Contents/Info.plist"

      - name: 启动冒烟测试
        run: |
          APP_BIN="dist/顿河学院学生测评管理软件.app/Contents/MacOS/顿河学院学生测评管理软件"
          "$APP_BIN" > app-startup.log 2>&1 &
          APP_PID=$!
          sleep 12
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat app-startup.log
            exit 1
          fi
          kill "$APP_PID" || true
          wait "$APP_PID" 2>/dev/null || true

      - name: 创建 DMG
        run: |
          APP_NAME="顿河学院学生测评管理软件"
          DMG_PATH="dist/${APP_NAME}-macOS-arm64.dmg"
          STAGING="dist/dmg-arm64"
          mkdir -p "$STAGING"
          cp -R "dist/${APP_NAME}.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG_PATH"
          rm -rf "$STAGING"
          shasum -a 256 "$DMG_PATH" > "${DMG_PATH}.sha256"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 顿河学院学生测评管理软件-macOS-arm64
          path: |
            dist/顿河学院学生测评管理软件-macOS-arm64.dmg
            dist/顿河学院学生测评管理软件-macOS-arm64.dmg.sha256
          retention-days: 30
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/顿河学院学生测评管理软件-macOS-arm64.dmg
            dist/顿河学院学生测评管理软件-macOS-arm64.dmg.sha256
          generate_release_notes: true
